<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi na Brasa - Gestão</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        header { background: #343a40; color: #fff; padding: 15px 20px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: #f8f9fa; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { color: #ffc107; }
        .container { background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-section, .list-section { margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background-color: #e9ecef; }
        button { background-color: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .form-group { margin-bottom: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>Boi na Brasa - Sistema de Gestão</h1>
        <nav>
            <a href="{% url 'usuarios:lista_criar' %}">Usuários</a>
            <a href="{% url 'fornecedores:lista_criar' %}">Fornecedores</a>
            <a href="{% url 'produtos:categoria_lista_criar' %}">Categorias</a>
            <a href="{% url 'produtos:produto_lista_criar' %}">Produtos</a>
            <a href="{% url 'vendas:lista_criar' %}">Vendas</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
