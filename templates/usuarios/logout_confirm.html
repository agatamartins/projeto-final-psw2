{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body text-center">

                <h1 class="h4 mb-3">
                    Encerrar sessão
                </h1>

                <p class="text-muted">
                    Deseja realmente sair do sistema?
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Sair
                    </button>

                    <a
                        href="{% url 'produtos:produto_lista_criar' %}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
