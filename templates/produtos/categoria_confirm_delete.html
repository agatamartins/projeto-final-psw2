{% extends 'base.html' %}

{% block title %}Excluir categoria{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-danger text-white">
        <h1 class="h4 mb-0">Excluir categoria</h1>
    </div>
    <div class="card-body">
        <p>Deseja realmente excluir a categoria <strong>{{ categoria.nome }}</strong>?</p>
        <p class="text-muted">{{ categoria.descricao|default:'Sem descrição.' }}</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
            <a href="{% url 'produtos:categoria_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
