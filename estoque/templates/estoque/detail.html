{% extends '_base.html' %}
{% block content %}
<h1 style="font-size: 2.5em; margin-bottom: 5px;">{{ sapato.modelo }}</h1>
<p style="color: var(--moss-olive); margin-bottom: 30px; font-weight: bold;">Detalhes do Sapato</p>

<div style="background-color: #242424; padding: 30px; border-radius: 10px; border-left: 5px solid var(--yellow-accent); max-width: 600px;">
    <table style="width: 100%; color: var(--yellow-dark); font-size: 1.1em;">
        <tr style="border-bottom: 1px solid #333;">
            <td style="padding: 10px 0; color: var(--yellow-pastel); font-weight: bold; width: 30%;">Marca:</td>
            <td>{{ sapato.marca }}</td>
        </tr>
        <tr style="border-bottom: 1px solid #333;">
            <td style="padding: 10px 0; color: var(--yellow-pastel); font-weight: bold;">Cor:</td>
            <td>{{ sapato.cor }}</td>
        </tr>
        <tr style="border-bottom: 1px solid #333;">
            <td style="padding: 10px 0; color: var(--yellow-pastel); font-weight: bold;">Tamanho:</td>
            <td>{{ sapato.tamanho }}</td>
        </tr>
        <tr>
            <td style="padding: 10px 0; color: var(--yellow-pastel); font-weight: bold;">Preço:</td>
            <td style="font-size: 1.8em; color: var(--yellow-accent);">R$ {{ sapato.preco }}</td>
        </tr>
    </table>
</div>

<div style="margin-top: 30px; display: flex; gap: 15px;">
    <a href="{% url 'sapato_list' %}" style="background: #333; color: white; padding: 12px 24px; border-radius: 5px; text-decoration: none;">← Voltar</a>
    <a href="{% url 'sapato_update' sapato.id %}" style="background-color: var(--yellow-accent); color: var(--moss-dark); padding: 12px 24px; border-radius: 5px; font-weight: bold; text-decoration: none;">Editar Sapato</a>
</div>
{% endblock %}
