{% extends '_base.html' %}
{% block content %}
<h2>Lista de Sapatos</h2>

<a href="{% url 'sapato_create' %}" style="background-color: var(--yellow-accent); color: var(--moss-dark); padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px;">
    👠 + Adicionar Novo Sapato
</a>

<style>
.custom-table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #242424; border-radius: 8px; overflow: hidden; }
.custom-table th { background-color: var(--moss-olive); color: white; text-align: left; padding: 12px 15px; text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; }
.custom-table td { padding: 12px 15px; border-bottom: 1px solid #333; }
.custom-table tr:hover { background-color: #2d2d2d; }
.action-links a { margin-right: 10px; font-weight: bold; font-size: 0.9em; }
</style>

<table class="custom-table">
    <thead>
        <tr>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Cor</th>
            <th>Tamanho</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for sapato in sapatos %}
        <tr>
            <td>{{ sapato.modelo }}</td>
            <td>{{ sapato.marca }}</td>
            <td>{{ sapato.cor }}</td>
            <td>{{ sapato.tamanho }}</td>
            <td style="color: var(--yellow-accent);">R$ {{ sapato.preco }}</td>
            <td class="action-links">
                <a href="{% url 'sapato_detail' sapato.id %}" style="color: var(--yellow-pastel);">Ver</a>
                <a href="{% url 'sapato_update' sapato.id %}" style="color: var(--yellow-accent);">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
